services:
  - type: web
    runtime: docker
    name: lifeOS-api
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: TZ
        value: America/Sao_Paulo
      - key: Cors__AllowedOrigins__0
        value: https://lifeos.vercel.app
      - key: Jwt__AccessTokenExpirationMinutes
        value: "15"
      - key: Jwt__RefreshTokenExpirationDays
        value: "30"
      - key: RateLimiting__LoginPermitLimit
        value: "10"
      - key: RateLimiting__LoginWindowMinutes
        value: "15"
      - key: RateLimiting__ApiPermitLimit
        value: "300"
      - key: RateLimiting__ApiWindowMinutes
        value: "1"
      - key: RateLimiting__RefreshPermitLimit
        value: "30"
      - key: RateLimiting__RefreshWindowMinutes
        value: "1"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Issuer
        sync: false
      - key: Jwt__Audience
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: BootstrapUser__UserId
        sync: false
      - key: BootstrapUser__UserName
        sync: false
      - key: BootstrapUser__DisplayName
        sync: false
      - key: BootstrapUser__Password
        sync: false
